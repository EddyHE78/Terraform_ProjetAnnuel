name: Terraform CI

# Vérifications rapides sans identifiants : format + validation.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  TF_VERSION: "1.17.1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [terraform/proxmox, terraform/aws, bootstrap/aws]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init -backend=false -input=false
      - run: terraform validate
